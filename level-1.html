<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Level 1: The Moss Gate</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #081018; color: #d7f9e8; }
    main { width: min(92vw, 760px); padding: 28px; border: 1px solid #295c5a; background: #0e1b24; box-shadow: 0 16px 60px #0008; }
    h1 { margin: 0 0 8px; font-size: clamp(1.25rem, 4vw, 2rem); color: #8be5c4; }
    .sub { margin: 0 0 22px; color: #91abb0; }
    #grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; width: min(100%, 680px); aspect-ratio: 20 / 12; margin: auto; }
    .cell { display: grid; place-items: center; min-width: 0; border-radius: 3px; background: #162833; color: #98b9bb; font-size: clamp(.65rem, 2.5vw, 1.25rem); line-height: 1; }
    .wall { background: #27404a; color: #5a7b7e; } .player { background: #16705c; color: #d8fff0; font-weight: 800; }
    .monster { background: #713c49; color: #ffd7d8; font-weight: 800; } .stairs { background: #655328; color: #ffe8a6; font-weight: 800; }
    .panel { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #295c5a; color: #9db9b7; }
    #status { margin-top: 14px; min-height: 1.5em; color: #8be5c4; } kbd { border: 1px solid #45686a; padding: 2px 6px; border-radius: 3px; color: #e2fff2; }
  </style>
</head>
<body>
<main>
  <h1>The Moss Gate</h1>
  <p class="sub">Reach <strong>&gt;</strong> before the dungeon takes all 5 HP.</p>
  <div id="grid" aria-label="20 by 12 dungeon grid"></div>
  <div class="panel"><span>HP: <strong id="hp">5</strong></span><span>Move: <kbd>WASD</kbd> or <kbd>Arrow keys</kbd></span><span><kbd>R</kbd> restart</span></div>
  <div id="status" role="status">Find the stairs.</div>
</main>
<script>
(() => {
  const map = [
    '####################',
    '#@....#.......#....#',
    '#.##..#.#####.#.##.#',
    '#....##.....#.#....#',
    '###.######..#.#.##.#',
    '#...#....#..#...#..#',
    '#.#.#.##.#.######..#',
    '#.#...#..#........>#',
    '#.#####.############',
    '#..................#',
    '#..................#',
    '####################'
  ];
  const rows = map.length, cols = map[0].length;
  const base = map.map(row => row.split(''));
  let player, monsters, hp, gameOver;
  const grid = document.querySelector('#grid'), hpEl = document.querySelector('#hp'), statusEl = document.querySelector('#status');
  const keyToMove = {ArrowUp:[-1,0],w:[-1,0],ArrowDown:[1,0],s:[1,0],ArrowLeft:[0,-1],a:[0,-1],ArrowRight:[0,1],d:[0,1]};
  function reset() {
    player = {r:1,c:1}; monsters = [{r:5,c:8},{r:7,c:15}]; hp=5; gameOver=false; statusEl.textContent='Find the stairs.'; render();
  }
  function isOpen(r,c) { return r>=0 && r<rows && c>=0 && c<cols && base[r][c] !== '#'; }
  function occupied(r,c, except) { return monsters.some((m,i)=>i!==except&&m.r===r&&m.c===c); }
  function render() {
    hpEl.textContent=hp; grid.replaceChildren();
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
      const el=document.createElement('div'), tile=base[r][c]; el.className='cell'+(tile==='#'?' wall':'')+(tile==='>'?' stairs':''); el.textContent=tile==='#'?'#':tile==='>'?'>':'';
      if(player.r===r&&player.c===c){el.className='cell player';el.textContent='@';}
      const monster=monsters.find(m=>m.r===r&&m.c===c); if(monster){el.className='cell monster';el.textContent='M';}
      grid.append(el);
    }
  }
  function takeDamage(){hp--; if(hp<=0){gameOver=true;statusEl.textContent='Game over — press R to restart.';}else statusEl.textContent='A monster hits you. Keep moving.';}
  function monsterStep(){
    monsters.forEach((m,i)=>{
      const choices=[[player.r-m.r,0],[0,player.c-m.c]].sort((a,b)=>Math.abs(b[0])+Math.abs(b[1])-Math.abs(a[0])-Math.abs(a[1]));
      const candidates=[]; for(const [dr,dc] of choices){if(dr||dc){const sr=Math.sign(dr),sc=Math.sign(dc);candidates.push([m.r+sr,m.c+sc]);}};
      for(const [nr,nc] of candidates){if(!isOpen(nr,nc)||occupied(nr,nc,i))continue;if(nr===player.r&&nc===player.c){takeDamage();return;}m.r=nr;m.c=nc;return;}
    });
  }
  function move(dr,dc){if(gameOver)return;const nr=player.r+dr,nc=player.c+dc;if(!isOpen(nr,nc)){statusEl.textContent='The wall blocks your path.';return;}if(occupied(nr,nc,-1)){takeDamage();render();return;}player={r:nr,c:nc};if(base[nr][nc]==='>'){gameOver=true;statusEl.textContent='You escaped! Press R to play again.';render();return;}monsterStep();render();}
  document.addEventListener('keydown', e => {if(e.key==='r'||e.key==='R'){reset();return;}const moveDelta=keyToMove[e.key];if(moveDelta){e.preventDefault();move(...moveDelta);}});
  reset();
})();
</script>
</body>
</html>
